[package]
name = "ciphertalk"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "CipherTalk — a Telegram-class messenger built with Axum, SQLx, Redis and vanilla JS"
license = "MIT"
publish = false

[dependencies]
# --- HTTP / async runtime -------------------------------------------------
axum = { version = "0.7.9", features = ["ws", "macros", "tracing", "multipart"] }
axum-extra = { version = "0.9.6", features = ["cookie"] }
tokio = { version = "1.43", features = ["full"] }
tower = { version = "0.4.13", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.5.2", features = [
    "cors",
    "trace",
    "fs",
    "compression-gzip",
    "limit",
    "timeout",
] }

# --- Persistence ----------------------------------------------------------
# `macros` enables compile-time checked query! / query_as! macros.
# `migrate` embeds ./migrations into the binary and applies them on boot.
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "chrono",
    "migrate",
    "macros",
] }
redis = { version = "0.27.6", features = ["tokio-comp", "connection-manager"] }

# --- Serialization --------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Auth / crypto --------------------------------------------------------
jsonwebtoken = "9.3"
argon2 = { version = "0.5.3", features = ["std"] }
rand = "0.8.5"
sha2 = "0.10"
hex = "0.4"
ring = "0.17"
hkdf = "0.12"
base64 = "0.22"

# --- Time / ids / collections --------------------------------------------
chrono = { version = "0.4.39", features = ["serde"] }
dashmap = "6.1"
futures-util = "0.3"

# --- Errors / observability / config -------------------------------------
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
time = "0.3"
mime_guess = "2.0"
percent-encoding = "2.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
