[package]
name = "messenger"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CipherTalk — мессенджер на Rust + axum + rqlite"

[dependencies]
# HTTP-сервер, роутер и WebSocket
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }

# Статика и CORS
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

# Сериализация JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP-клиент к rqlite (только rustls, без OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Авторизация
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"

# Логи
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Утилиты для WebSocket (split sink/stream)
futures-util = "0.3"
