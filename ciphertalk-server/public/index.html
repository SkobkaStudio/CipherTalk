<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CipherTalk — КипяТок</title>
<link rel="stylesheet" href="/features.css">
<link rel="stylesheet" href="/motion.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#17212b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #17212b;
  --bg-secondary: #0e1621;
  --bg-chat: #0e1621;
  --bg-message-in: #182533;
  --bg-message-out: #2b5278;
  --text-primary: #f5f5f5;
  --text-secondary: #7e919e;
  --accent: #5eb5f7;
  --accent-hover: #4a9de0;
  --border: #1e2c3a;
  --hover: #202d3b;
  --danger: #e53935;
  --success: #4caf50;
  --online: #4caf50;
  --sidebar-width: 380px;
  --accent-2: #3a7bd5;
  --glass-rgb: 20, 30, 44;
  --glass-blur: 14px;
  --glass-alpha: 0.55;
  --glass-saturate: 140%;
  --glow-strength: 0px;
  --radius: 12px;
  --msg-font-size: 14px;
  --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --msg-font-family: var(--font-family);
  --msg-font-weight: 400;
  --msg-line-height: 1.45;
}

body {
  font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}

#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: linear-gradient(135deg, #0e1621 0%, #17212b 100%);
  padding: 20px;
  position: relative;
  z-index: 1;
}

.login-box {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 32px 24px;
  width: 440px;
  max-width: 100%;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.login-logo {
  width: 90px;
  height: 90px;
  margin: 0 auto 16px;
  background: linear-gradient(135deg, var(--accent), #3a7bd5);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
}

.login-box h1 {
  font-size: 24px;
  margin-bottom: 6px;
  background: linear-gradient(135deg, var(--accent), #89d4ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.login-box .subtitle {
  color: var(--text-secondary);
  margin-bottom: 20px;
  font-size: 13px;
}

.steps-progress {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}

.step-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--border);
  transition: all 0.3s;
}

.step-dot.active { background: var(--accent); transform: scale(1.2); }
.step-dot.done { background: var(--success); }

.step-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }

.step-description {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 16px;
  min-height: 32px;
}

.input-group {
  margin-bottom: 12px;
  text-align: left;
  position: relative;
}

.input-group label {
  display: block;
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.input-group label .required { color: var(--danger); }

.input-group input {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-primary);
  border: 2px solid var(--border);
  border-radius: 10px;
  color: var(--text-primary);
  font-size: 15px;
  transition: border-color 0.2s;
  outline: none;
}

.input-group input:focus { border-color: var(--accent); }
.input-group input.error { border-color: var(--danger); }
.input-group input.success { border-color: var(--success); }

.input-hint { font-size: 12px; margin-top: 5px; min-height: 16px; }
.input-hint.error { color: var(--danger); }
.input-hint.success { color: var(--success); }
.input-hint.info { color: var(--text-secondary); }

.username-preview {
  display: inline-block;
  padding: 3px 8px;
  background: var(--bg-primary);
  border-radius: 6px;
  font-size: 12px;
  color: var(--accent);
  margin-top: 4px;
}

.row { display: flex; gap: 10px; }
.row .input-group { flex: 1; }

.btn {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 8px;
}

.btn:hover { background: var(--accent-hover); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-secondary {
  background: transparent;
  border: 2px solid var(--border);
  color: var(--text-primary);
}

.btn-secondary:hover { background: var(--hover); }

#app { display: none; height: 100vh; position: relative; z-index: 1; }
.app-container { display: flex; height: 100vh; }

.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  min-height: 56px;
}

.menu-btn {
  width: 38px;
  height: 38px;
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 50%;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  flex-shrink: 0;
}

.menu-btn:hover { background: var(--hover); }

.search-box { flex: 1; position: relative; }

.search-box input {
  width: 100%;
  padding: 9px 14px 9px 34px;
  background: var(--bg-primary);
  border: none;
  border-radius: 20px;
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
}

.search-box .mq-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  z-index: 1;
  pointer-events: none;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.chat-item {
  display: flex;
  align-items: center;
  padding: 9px 14px;
  cursor: pointer;
  transition: background 0.15s;
  gap: 10px;
  position: relative;
}

.chat-item:hover { background: var(--hover); }
.chat-item.active { background: var(--accent); }
.chat-item.active .chat-time,
.chat-item.active .chat-preview { color: rgba(255,255,255,0.8); }

.chat-avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5eb5f7, #3a7bd5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 600;
  flex-shrink: 0;
  position: relative;
}

.chat-avatar.online::after {
  content: '';
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 11px;
  height: 11px;
  background: var(--online);
  border-radius: 50%;
  border: 2px solid var(--bg-secondary);
}

/* Картинки аватаров (app.js: chatAvatarMarkup / userAvatarMarkup / setChatAvatar)
   строго вписываются в круг контейнера и не должны «расползаться» по панели. */
.chat-avatar__img {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}
.member-avatar .chat-avatar__img,
.forward-item .fi-avatar .chat-avatar__img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.chat-info { flex: 1; min-width: 0; }

.chat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}

.chat-name {
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-time { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
.chat-bottom { display: flex; justify-content: space-between; align-items: center; }

.chat-preview {
  font-size: 14px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-chat);
  background-image: 
    radial-gradient(circle at 20% 50%, rgba(94,181,247,0.03) 0%, transparent 50%),
    radial-gradient(circle at 80% 50%, rgba(58,123,213,0.03) 0%, transparent 50%);
  min-width: 0;
}

.chat-header {
  padding: 10px 16px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
}

.chat-header-info { flex: 1; min-width: 0; }
.chat-header-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-header-status { font-size: 13px; color: var(--text-secondary); }
.chat-header-status.online { color: var(--accent); }
.chat-header-name-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.enc-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700; letter-spacing: .3px;
  padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  text-transform: uppercase;
}
.enc-badge.secured { color: #34d399; background: rgba(52,211,153,.14); border: 1px solid rgba(52,211,153,.35); }
.enc-badge.pending { color: #fbbf24; background: rgba(251,191,36,.14); border: 1px solid rgba(251,191,36,.35); animation: encPulse 1.6s ease-in-out infinite; }
@keyframes encPulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
.settings-hint { font-size: 12px; color: var(--text-secondary); margin: 4px 0 10px; line-height: 1.45; }
.chat-header-actions { display: flex; gap: 2px; flex-shrink: 0; }

.messages-container {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.message {
  max-width: 78%;
  width: fit-content;
  padding: 8px 12px;
  border-radius: 12px;
  position: relative;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  word-break: break-word;
  animation: messageSlide 0.2s ease-out;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.in {
  background: var(--bg-message-in);
  align-self: flex-start;
  border-bottom-left-radius: calc(var(--radius, 12px) * 0.34);
}

.message.out {
  background: var(--bg-message-out);
  align-self: flex-end;
  border-bottom-right-radius: calc(var(--radius, 12px) * 0.34);
}

/* Telegram-подобные «хвостики» у последнего сообщения в группе */
.message.in + .message.out,
.message.out + .message.in { margin-top: 8px; }

.message.in:last-child::after,
.message.out:last-child::after {
  content: '';
  position: absolute;
  bottom: 0;
  width: 9px;
  height: 14px;
}

.message.in:last-child::after {
  left: -6px;
  background: radial-gradient(circle at 100% 0, transparent 9px, var(--bg-message-in) 9px);
}

.message.out:last-child::after {
  right: -6px;
  background: radial-gradient(circle at 0 0, transparent 9px, var(--bg-message-out) 9px);
}

/* Атмосферный снежный слой поверх интерфейса, но под меню/модалками.
   pointer-events:none — клики проходят сквозь. */
#snow-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
}

@media (prefers-reduced-motion: reduce) {
  #snow-canvas { display: none; }
  .message { animation: none; }
}

.message-sender {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 2px;
}

.message-text { font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }

.message-meta {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 3px;
  margin-top: 3px;
  font-size: 10px;
  color: var(--text-secondary);
}

.message.out .message-meta { color: rgba(255,255,255,0.6); }
.message-edited { font-style: italic; }

.message-actions {
  position: absolute;
  top: -7px;
  right: 7px;
  background: var(--bg-secondary);
  border-radius: 10px;
  padding: 2px;
  display: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.message:hover .message-actions { display: flex; }

.msg-action-btn {
  width: 26px;
  height: 26px;
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 50%;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.msg-action-btn:hover { background: var(--hover); color: var(--text-primary); }

.date-separator { text-align: center; margin: 14px 0; }

.date-separator span {
  background: rgba(0,0,0,0.3);
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 12px;
  color: var(--text-secondary);
}

/* ==================== ПАНЕЛЬ ВВОДА ==================== */
.input-area {
  padding: 8px 12px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  gap: 8px;
  min-height: 60px;
}

.attach-btn {
  width: 40px;
  height: 40px;
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 50%;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s;
}

.attach-btn:hover { background: var(--hover); }

.attach-btn.recording {
  color: var(--danger);
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.message-input {
  flex: 1;
  min-width: 0;
  background: var(--bg-primary);
  border: none;
  border-radius: 20px;
  padding: 10px 16px;
  color: var(--text-primary);
  font-size: 15px;
  resize: none;
  max-height: 120px;
  min-height: 40px;
  outline: none;
  font-family: inherit;
  line-height: 1.4;
}

.send-btn {
  width: 40px;
  height: 40px;
  background: var(--accent);
  border: none;
  border-radius: 50%;
  color: white;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s;
}

.send-btn:active { transform: scale(0.92); }
.send-btn.sending-pop {
  animation: sendPop 0.28s ease;
}
@keyframes sendPop {
  0% { transform: scale(1); }
  40% { transform: scale(1.25); }
  100% { transform: scale(1); }
}

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  padding: 20px;
}

.empty-state-icon { font-size: 70px; margin-bottom: 14px; opacity: 0.5; }
.empty-state h2 { font-size: 20px; margin-bottom: 6px; color: var(--text-primary); }

.encryption-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--success);
  background: rgba(76,175,80,0.1);
  padding: 2px 8px;
  border-radius: 10px;
}

.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--bg-secondary);
  border-radius: 16px;
  padding: 28px 24px;
  width: 440px;
  max-width: 100%;
  max-height: 80vh;
  overflow-y: auto;
}

.modal h2 { margin-bottom: 18px; font-size: 20px; }

.modal-close {
  float: right;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 22px;
  cursor: pointer;
  margin-top: -6px;
}

.side-menu {
  position: fixed;
  top: 0; left: -300px; bottom: 0;
  width: 280px;
  background: var(--bg-secondary);
  z-index: 999;
  transition: left 0.3s;
  display: flex;
  flex-direction: column;
  box-shadow: 4px 0 16px rgba(0,0,0,0.3);
}

.side-menu.open { left: 0; }

.side-menu-header {
  padding: 18px;
  background: linear-gradient(135deg, var(--accent), #3a7bd5);
}

.side-menu-avatar {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 10px;
}

.side-menu-name { font-size: 17px; font-weight: 600; }
.side-menu-username { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.side-menu-phone { font-size: 12px; opacity: 0.7; margin-top: 3px; }

.side-menu-items { flex: 1; padding: 6px 0; overflow-y: auto; }

.side-menu-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 18px;
  cursor: pointer;
  transition: background 0.15s;
  color: var(--text-primary);
  border: none;
  background: none;
  width: 100%;
  font-size: 14px;
  text-align: left;
}

.side-menu-item:hover { background: var(--hover); }
.side-menu-item .icon { font-size: 18px; width: 26px; text-align: center; }
.side-menu-divider { height: 1px; background: var(--border); margin: 6px 0; }

.side-menu-lang { display: flex; gap: 8px; padding: 4px 18px 8px; }
.lang-chip {
  flex: 1;
  padding: 7px 0;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--hover);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.6px;
  cursor: pointer;
  transition: all 0.18s ease;
}
.lang-chip:hover { color: var(--text-primary); border-color: var(--accent); }
.lang-chip.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
}

.menu-backdrop {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 998;
  display: none;
}

.menu-backdrop.show { display: block; }

.search-results { max-height: 350px; overflow-y: auto; }

.search-result-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.15s;
}

.search-result-item:hover { background: var(--hover); }

.typing-indicator { display: flex; gap: 3px; padding: 3px 0; }

.typing-indicator span {
  width: 5px;
  height: 5px;
  background: var(--text-secondary);
  border-radius: 50%;
  animation: typing 1.4s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* ==================== МОБИЛЬНАЯ АДАПТАЦИЯ ==================== */
@media (max-width: 768px) {
  .sidebar {
    width: 100%;
    position: absolute;
    z-index: 10;
    left: 0;
    right: 0;
  }
  
  .chat-area {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    display: none;
  }
  
  .app-container.chat-open .sidebar { display: none; }
  .app-container.chat-open .chat-area { display: flex; }
  
  .back-btn { display: block !important; }
  
  .message { max-width: 85%; }
  
  .input-area {
    padding: 6px 8px;
    gap: 6px;
  }
  
  .attach-btn {
    width: 36px;
    height: 36px;
    font-size: 18px;
  }
  
  .message-input {
    padding: 8px 14px;
    font-size: 14px;
  }
  
  .send-btn {
    width: 36px;
    height: 36px;
    font-size: 16px;
  }
  
  .side-menu { width: 260px; left: -260px; }
  
  .login-box { padding: 24px 20px; }
  .login-logo { width: 80px; height: 80px; font-size: 34px; }
  .login-box h1 { font-size: 22px; }
  
  .row { flex-direction: column; gap: 0; }
}

.back-btn { display: none; }

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 18px;
  z-index: 2000;
  animation: slideIn 0.3s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  max-width: 90%;
}

@keyframes slideIn {
  from { transform: translateX(-50%) translateY(100%); opacity: 0; }
  to { transform: translateX(-50%) translateY(0); opacity: 1; }
}

.toast.success { border-left: 4px solid var(--success); }
.toast.error { border-left: 4px solid var(--danger); }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.password-toggle {
  position: absolute;
  right: 10px;
  top: 36px;
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 16px;
}

/* Медиа сообщения */
.media-message {
  max-width: 240px;
  border-radius: 12px;
  overflow: hidden;
  margin: 4px 0;
}

.voice-message {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: rgba(0,0,0,0.2);
  border-radius: 20px;
  min-width: 180px;
}

.voice-play-btn {
  width: 36px;
  height: 36px;
  background: var(--accent);
  border: none;
  border-radius: 50%;
  color: white;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.voice-waveform {
  flex: 1;
  height: 24px;
  display: flex;
  align-items: center;
  gap: 2px;
}

.voice-bar {
  flex: 1;
  background: var(--accent);
  border-radius: 2px;
  opacity: 0.6;
}

.voice-duration {
  font-size: 12px;
  color: var(--text-secondary);
  min-width: 35px;
}

.video-circle {
  position: relative;
  width: min(220px, 62vw);
  height: min(220px, 62vw);
  border-radius: 50%;
  overflow: hidden;
  background: #000;
  margin: 4px 0;
  cursor: pointer;
}

.video-circle video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-circle .video-play {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  color: #fff;
  background: rgba(0, 0, 0, 0.28);
  transition: opacity 0.2s;
  pointer-events: none;
}

.video-circle.playing .video-play { opacity: 0; }

.video-circle .video-duration {
  position: absolute;
  right: 16px;
  bottom: 16px;
  font-size: 11px;
  color: #fff;
  background: rgba(0, 0, 0, 0.5);
  padding: 2px 7px;
  border-radius: 9px;
  pointer-events: none;
}

.image-message {
  max-width: 260px;
  border-radius: 12px;
  overflow: hidden;
  margin: 4px 0;
  background: rgba(0, 0, 0, 0.2);
}

.image-message img {
  display: block;
  max-width: 260px;
  max-height: 320px;
  width: auto;
  cursor: zoom-in;
}

.media-loading {
  padding: 18px 20px;
  font-size: 12px;
  color: var(--text-secondary);
}

.file-message {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 12px;
  max-width: 260px;
  cursor: pointer;
  margin: 4px 0;
}

.file-icon { font-size: 26px; flex-shrink: 0; }
.file-info { min-width: 0; }
.file-name {
  font-size: 13px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-size { font-size: 11px; color: var(--text-secondary); }

.voice-message audio {
  width: 190px;
  height: 32px;
}

.attach-btn.active {
  color: var(--accent);
  background: var(--hover);
}

.attach-btn:disabled { opacity: 0.4; cursor: default; }

/* Recording indicator */
.recording-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: rgba(229, 57, 53, 0.1);
  border-radius: 20px;
  flex: 1;
}

.recording-dot {
  width: 10px;
  height: 10px;
  background: var(--danger);
  border-radius: 50%;
  animation: pulse 1s infinite;
}

.recording-time {
  font-size: 14px;
  color: var(--danger);
  font-weight: 600;
}

.recording-text {
  font-size: 13px;
  color: var(--text-secondary);
}

/* ==================== ФОН ЧАТА ==================== */
.chat-area[data-bg="aurora"] {
  background-image:
    linear-gradient(135deg, rgba(94,181,247,0.10), rgba(58,213,155,0.10)),
    radial-gradient(circle at 25% 20%, rgba(94,181,247,0.16), transparent 55%),
    radial-gradient(circle at 80% 75%, rgba(155,89,182,0.16), transparent 55%);
}
.chat-area[data-bg="sunset"] {
  background-image: linear-gradient(135deg, rgba(255,94,98,0.14), rgba(255,153,102,0.14), rgba(255,205,102,0.14));
}
.chat-area[data-bg="forest"] {
  background-image: linear-gradient(135deg, rgba(46,204,113,0.14), rgba(26,188,156,0.14));
}
.chat-area[data-bg="grid"] {
  background-image:
    linear-gradient(rgba(94,181,247,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(94,181,247,0.08) 1px, transparent 1px);
  background-size: 28px 28px;
}
.chat-area[data-bg="dots"] {
  background-image: radial-gradient(rgba(94,181,247,0.16) 1.2px, transparent 1.2px);
  background-size: 22px 22px;
}
.chat-area[data-bg="waves"] {
  background-image:
    repeating-linear-gradient(135deg, rgba(94,181,247,0.07) 0 2px, transparent 2px 22px),
    repeating-linear-gradient(45deg, rgba(58,213,155,0.06) 0 2px, transparent 2px 22px);
}
.chat-area[data-bg="stars"] {
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.55), transparent 100%),
    radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.45), transparent 100%),
    radial-gradient(1.5px 1.5px at 45% 80%, rgba(255,255,255,0.35), transparent 100%),
    radial-gradient(1px 1px at 85% 20%, rgba(255,255,255,0.45), transparent 100%),
    radial-gradient(1px 1px at 35% 15%, rgba(255,255,255,0.3), transparent 100%);
  background-size: 240px 240px;
}

/* ==================== GLASSMORPHISM ==================== */
html[data-glass="on"] .sidebar,
html[data-glass="on"] .chat-header,
html[data-glass="on"] .input-area,
html[data-glass="on"] .side-menu,
html[data-glass="on"] .modal,
html[data-glass="on"] .toast,
html[data-glass="on"] .ctx-menu,
html[data-glass="on"] .react-bar {
  background: rgba(var(--glass-rgb), var(--glass-alpha)) !important;
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
}
html[data-glass="on"] .login-box {
  background: rgba(var(--glass-rgb), calc(var(--glass-alpha) + 0.05)) !important;
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
}
html[data-glass="on"] .chat-avatar,
html[data-glass="on"] .send-btn,
html[data-glass="on"] .btn,
html[data-glass="on"] .voice-play-btn {
  box-shadow: 0 0 var(--glow-strength) color-mix(in srgb, var(--accent) 70%, transparent);
}


/* ==================== SIDEBAR: ПУЛЬСАЦИЯ ОНЛАЙН ==================== */
.chat-avatar.online::after {
  animation: onlinePulse 2s ease-in-out infinite;
}
@keyframes onlinePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.6); }
  50% { box-shadow: 0 0 0 4px rgba(76,175,80,0); }
}

.chat-avatar.online {
  box-shadow: 0 0 0 2px rgba(76,175,80,0.25);
}

/* Плавное появление строк списка контактов */
.chat-item {
  animation: rowIn 0.28s ease backwards;
}
@keyframes rowIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ==================== АНИМАЦИЯ ОТПРАВКИ СООБЩЕНИЯ ==================== */
.message.sending {
  opacity: 0.55;
  transform: translateY(4px) scale(0.98);
}
.message.sent-pop {
  animation: sentPop 0.32s cubic-bezier(0.2, 0.8, 0.3, 1.4);
}
@keyframes sentPop {
  0% { transform: scale(0.96) translateY(6px); opacity: 0.6; }
  60% { transform: scale(1.02); }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

/* Печатная машинка: мигающий курсор */
.typewriter-caret {
  display: inline-block;
  width: 2px;
  height: 1em;
  background: currentColor;
  vertical-align: text-bottom;
  margin-left: 1px;
  animation: caretBlink 0.8s step-end infinite;
}
@keyframes caretBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* Плавные переходы экранов */
.login-step { animation: stepFade 0.32s ease; }
@keyframes stepFade {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-step.leaving { animation: stepOut 0.2s ease forwards; }
@keyframes stepOut {
  to { opacity: 0; transform: translateY(-12px); }
}

/* ==================== НАСТРОЙКИ ВНЕШНЕГО ВИДА ==================== */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.theme-swatch {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--bg-primary);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 13px;
  transition: border-color 0.15s, transform 0.1s;
}
.theme-swatch:hover { transform: translateY(-1px); }
.theme-swatch.active { border-color: var(--accent); }
.theme-swatch .dots { display: flex; gap: 3px; }
.theme-swatch .dots i {
  width: 12px; height: 12px; border-radius: 50%; display: inline-block;
}
.bg-grid, .timer-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.bg-swatch {
  height: 46px;
  border: 2px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  background: var(--bg-chat);
  position: relative;
  overflow: hidden;
  transition: border-color 0.15s;
}
.bg-swatch.active { border-color: var(--accent); }
.bg-swatch span {
  position: absolute; bottom: 3px; right: 6px;
  font-size: 11px; color: var(--text-secondary);
}
.bg-swatch[data-preview="aurora"] {
  background: linear-gradient(135deg, rgba(94,181,247,0.35), rgba(58,213,155,0.35)), #0e1621;
}
.bg-swatch[data-preview="sunset"] {
  background: linear-gradient(135deg, rgba(255,94,98,0.4), rgba(255,153,102,0.4), rgba(255,205,102,0.4)), #0e1621;
}
.bg-swatch[data-preview="forest"] {
  background: linear-gradient(135deg, rgba(46,204,113,0.4), rgba(26,188,156,0.4)), #0e1621;
}
.bg-swatch[data-preview="grid"] {
  background-image:
    linear-gradient(rgba(94,181,247,0.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(94,181,247,0.35) 1px, transparent 1px);
  background-size: 12px 12px;
}
.switch-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; font-size: 14px;
}
.switch {
  width: 44px; height: 24px; border-radius: 12px;
  background: var(--border); position: relative; cursor: pointer;
  transition: background 0.2s; flex-shrink: 0;
}
.switch.on { background: var(--accent); }
.switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 20px; height: 20px; border-radius: 50%; background: #fff;
  transition: transform 0.2s;
}
.switch.on::after { transform: translateX(20px); }
.settings-section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-secondary); margin: 16px 0 8px;
}

/* Слайдер */
.slider-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.slider-row .slider-value { font-size: 12px; color: var(--text-secondary); min-width: 36px; text-align: right; }

/* PIN-код */
.pin-input {
  width: 100%; padding: 12px; text-align: center; font-size: 22px; letter-spacing: 8px;
  background: var(--bg-primary); border: 2px solid var(--border); border-radius: 10px;
  color: var(--text-primary); outline: none;
}
.pin-input:focus { border-color: var(--accent); }

/* Экран блокировки PIN */
#pin-lock-screen {
  position: fixed; inset: 0; z-index: 5000;
  background: var(--bg-primary);
  display: none; align-items: center; justify-content: center;
}
#pin-lock-screen.show { display: flex; }
.pin-lock-box {
  background: var(--bg-secondary); border-radius: 16px; padding: 32px 24px;
  width: 340px; max-width: 90%; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.pin-lock-box .pin-logo { font-size: 44px; margin-bottom: 12px; }
.pin-lock-box h2 { margin-bottom: 6px; font-size: 19px; }
.pin-lock-box p { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
.pin-error { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }

/* Галочки прочтения */
.tick-marks { font-size: 10px; }
.tick-marks.read { color: var(--accent); }

/* ==================== ТИПОГРАФИКА ==================== */
.preset-row,
.anim-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
}
.preset-chip,
.anim-chip {
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-primary);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.16s ease;
}
.preset-chip:hover,
.anim-chip:hover { color: var(--text-primary); border-color: var(--accent); }
.preset-chip.active,
.anim-chip.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2, var(--accent)));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
}
.font-row { margin-top: -2px; }
.message-text,
.message-input {
  font-size: var(--msg-font-size, 14px);
}
/* Шрифт, начертание и межстрочный интервал сообщений настраиваются пользователем */
.message-text {
  font-family: var(--msg-font-family, var(--font-family, inherit));
  font-weight: var(--msg-font-weight, 400);
  line-height: var(--msg-line-height, 1.45);
}
.message-input { font-family: var(--font-family, inherit); }

/* Настройки типографики */
.row-label {
  font-size: 13px;
  color: var(--text-secondary);
  align-self: center;
  margin-right: 2px;
}
.custom-font-input {
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius, 12px);
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-size: 13px;
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
}
.custom-font-input:focus {
  outline: none;
  border-color: var(--accent);
}
.font-preview {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: var(--radius, 12px);
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-primary);
  overflow-wrap: anywhere;
}

/* Хвостики сообщений можно отключить */
html[data-tails="off"] .message.in:last-child::after,
html[data-tails="off"] .message.out:last-child::after { display: none; }
html[data-tails="off"] .message.in:last-child,
html[data-tails="off"] .message.out:last-child { border-radius: var(--radius, 12px); }

/* Уровни анимации */
html[data-anim="off"] *,
html[data-anim="off"] *::before,
html[data-anim="off"] *::after {
  animation-duration: 0s !important;
  animation-iteration-count: 1 !important;
  transition-duration: 0s !important;
}
html[data-anim="full"] .chat-avatar.online::after { animation-duration: 1.2s; }
html[data-anim="full"] .message { animation-duration: 0.32s; }

/* Дополнительные превью фонов */
.bg-swatch[data-preview="dots"] {
  background-image: radial-gradient(rgba(94,181,247,0.5) 1px, transparent 1px), #0e1621;
  background-size: 10px 10px;
}
.bg-swatch[data-preview="waves"] {
  background-image:
    repeating-linear-gradient(135deg, rgba(94,181,247,0.4) 0 1px, transparent 1px 10px),
    repeating-linear-gradient(45deg, rgba(58,213,155,0.35) 0 1px, transparent 1px 10px),
    #0e1621;
}
.bg-swatch[data-preview="stars"] {
  background-image:
    radial-gradient(1px 1px at 20% 30%, #fff, transparent),
    radial-gradient(1px 1px at 70% 60%, #cbe8ff, transparent),
    radial-gradient(1.5px 1.5px at 45% 80%, #fff, transparent),
    radial-gradient(1px 1px at 85% 20%, #9fd4ff, transparent),
    #0e1621;
  background-size: 70px 70px;
}

/* ==================== ВЗРЫВ РЕАКЦИЙ ==================== */
.reaction-burst {
  position: fixed;
  left: 0;
  top: 0;
  pointer-events: none;
  z-index: 6000;
  font-size: 22px;
  will-change: transform, opacity;
  transform: translate(-50%, -50%);
  animation: reactionFloat 0.95s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}
@keyframes reactionFloat {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  100% {
    opacity: 0;
    transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, -70px))) scale(1.35) rotate(var(--rot, 0deg));
  }
}

/* ==================== 3 КОЛОНКИ НА ПК ==================== */
@media (min-width: 1100px) {
  .app-container { flex-direction: row; }
  .side-menu {
    position: relative;
    top: auto;
    bottom: auto;
    left: 0;
    width: 260px;
    height: 100vh;
    z-index: 1;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    box-shadow: none;
  }
  .side-menu.open { left: 0; }
  .side-menu .menu-backdrop { display: none !important; }
  .menu-backdrop { display: none !important; }
  .sidebar { width: 340px; }
}

/* ==================== WEBRTC ЗВОНКИ ==================== */
.call-overlay {
  position: fixed;
  inset: 0;
  z-index: 7000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.62);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  backdrop-filter: blur(18px) saturate(140%);
}
.call-overlay.show { display: flex; }
.call-card {
  position: relative;
  width: 420px;
  max-width: 100%;
  min-height: 420px;
  border-radius: 26px;
  overflow: hidden;
  background: linear-gradient(160deg, rgba(var(--glass-rgb), 0.92), rgba(var(--glass-rgb), 0.72));
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), 0 0 40px var(--glow-strength) rgba(var(--glass-rgb), 0.4);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#call-remote {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
  z-index: 0;
}
#call-local {
  position: absolute;
  right: 14px;
  top: 14px;
  width: 108px;
  height: 144px;
  border-radius: 14px;
  object-fit: cover;
  background: #111;
  border: 1px solid rgba(255,255,255,.2);
  z-index: 3;
  box-shadow: 0 6px 20px rgba(0,0,0,.45);
}
.call-glow {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(circle at 50% 30%, rgba(var(--glass-rgb), 0.05), rgba(0, 0, 0, 0.55));
}
.call-top {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-top: auto;
  padding: 30px 20px 14px;
  text-align: center;
}
.call-avatar {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2, var(--accent)));
  box-shadow: 0 0 0 6px rgba(var(--glass-rgb), 0.35), 0 0 30px var(--accent);
}
.call-name { font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.call-status { font-size: 14px; color: rgba(255,255,255,.8); min-height: 20px; }
.call-actions {
  position: relative;
  z-index: 2;
  display: flex;
  gap: 14px;
  padding: 16px 20px 30px;
  margin-top: auto;
  flex-wrap: wrap;
  justify-content: center;
}
.call-btn-circle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.14);
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .15s ease, background .15s ease;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.call-btn-circle:hover { transform: translateY(-2px); background: rgba(255,255,255,.24); }
.call-btn-circle.accept { background: #2ecc71; border-color: transparent; }
.call-btn-circle.danger { background: #e53935; border-color: transparent; }
.call-btn-circle.off { background: rgba(255,255,255,.3); }
.call-overlay.audio #call-remote { display: none; }
.call-overlay.audio .call-card { background: linear-gradient(160deg, rgba(var(--glass-rgb), 0.95), rgba(var(--glass-rgb), 0.75)); }
.call-header-btn { font-size: 16px !important; }

@media (max-width: 600px) {
  .call-card { min-height: 100%; height: 100%; border-radius: 0; }
  .call-overlay { padding: 0; }
  #call-local { width: 92px; height: 124px; }
}

.safety-block {
  margin-top: 18px;
  padding: 14px;
  border-radius: 14px;
  background: rgba(var(--glass-rgb), 0.45);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.safety-title { font-weight: 700; margin-bottom: 8px; }
.safety-number {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 15px;
  letter-spacing: 1px;
  line-height: 1.7;
  text-align: center;
  padding: 10px 0;
  word-spacing: 6px;
  color: var(--accent);
  user-select: all;
}
.safety-hint { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; line-height: 1.5; }
</style>

<!-- ==================== ЭКРАН ВХОДА ==================== -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><svg class="mq-icon mq-icon--lg" aria-hidden="true" focusable="false"><use href="#mq-i-lock"></use></svg></div>
    <h1>CipherTalk</h1>
    <p class="subtitle" data-i18n="app.tagline"></p>
    
    <div class="steps-progress" id="steps-progress">
      <div class="step-dot active" data-step="1"></div>
      <div class="step-dot" data-step="2"></div>
      <div class="step-dot" data-step="3"></div>
      <div class="step-dot" data-step="4"></div>
      <div class="step-dot" data-step="5"></div>
    </div>

    <div class="login-step" id="step-1">
      <div class="step-title" data-i18n="auth.phone.title"></div>
      <div class="step-description" data-i18n="auth.phone.desc"></div>
      <div class="input-group">
        <label data-i18n="auth.phone.label"></label>
        <input type="tel" id="phone-input" placeholder="+7 (999) 123-45-67" value="+7">
      </div>
      <button class="btn" id="send-code-btn" data-action="step1Next" data-i18n="auth.next"></button>
    </div>

    <div class="login-step" id="step-2" style="display:none">
      <div class="step-title" data-i18n="auth.code.title"></div>
      <div class="step-description" id="step-2-desc" data-i18n="auth.code.desc"></div>
      <div class="input-group">
        <label data-i18n="auth.code.label"></label>
        <input type="text" id="code-input" placeholder="123456" maxlength="6" inputmode="numeric" pattern="[0-9]*" autofocus>
        <div class="input-hint info" data-i18n="auth.code.hint"></div>
      </div>
      <button class="btn" data-action="step2Next" data-i18n="auth.code.confirm"></button>
      <button class="btn btn-secondary" data-action="goToStep" data-step="1" data-i18n="auth.code.change"></button>
    </div>

    <div class="login-step" id="step-3-register" style="display:none">
      <div class="step-title" data-i18n="auth.name.title"></div>
      <div class="step-description" data-i18n="auth.name.desc"></div>
      <div class="row">
        <div class="input-group">
          <label><span data-i18n="auth.firstname"></span> <span class="required">*</span></label>
          <input type="text" id="firstname-input" placeholder="Иван" data-i18n-placeholder="auth.firstname.placeholder">
        </div>
        <div class="input-group">
          <label data-i18n="auth.lastname"></label>
          <input type="text" id="lastname-input" placeholder="Иванов" data-i18n-placeholder="auth.lastname.placeholder">
        </div>
      </div>
      <button class="btn" data-action="step3RegNext" data-i18n="auth.next"></button>
      <button class="btn btn-secondary" data-action="goToStep" data-step="1" data-i18n="auth.back"></button>
    </div>

    <div class="login-step" id="step-3-login" style="display:none">
      <div class="step-title"><span data-i18n="auth.welcome.text"></span> <span id="welcome-name"></span>!</div>
      <div class="step-description" data-i18n="auth.welcome.desc"></div>
      <div class="input-group">
        <label data-i18n="auth.password"></label>
        <input type="password" id="password-input" placeholder="Ваш пароль" data-i18n-placeholder="auth.password.placeholder">
        <button class="password-toggle" data-action="togglePassword" data-target="password-input"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-eye"></use></svg></button>
      </div>
      <button class="btn" data-action="step3LoginNext" data-i18n="auth.login"></button>
      <button class="btn btn-secondary" data-action="goToStep" data-step="1" data-i18n="auth.back"></button>
    </div>

    <div class="login-step" id="step-4" style="display:none">
      <div class="step-title" data-i18n="auth.username.title"></div>
      <div class="step-description" data-i18n="auth.username.desc"></div>
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username-input" placeholder="ivan_ivanov" data-action="checkUsername">
        <div class="input-hint info" id="username-hint" data-i18n="auth.username.hint"></div>
      </div>
      <button class="btn" id="username-next-btn" data-action="step4Next" disabled data-i18n="auth.next"></button>
      <button class="btn btn-secondary" data-action="goToStep" data-step="3" data-i18n="auth.back"></button>
    </div>

    <div class="login-step" id="step-5" style="display:none">
      <div class="step-title" data-i18n="auth.newpass.title"></div>
      <div class="step-description" data-i18n="auth.newpass.desc"></div>
      <div class="input-group">
        <label data-i18n="auth.password"></label>
        <input type="password" id="new-password-input" placeholder="Минимум 6 символов" data-i18n-placeholder="auth.newpass.min" data-action="checkPasswordStrength">
        <button class="password-toggle" data-action="togglePassword" data-target="new-password-input"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-eye"></use></svg></button>
      </div>
      <div class="input-group">
        <label data-i18n="auth.newpass.repeat"></label>
        <input type="password" id="confirm-password-input" placeholder="Повторите пароль" data-i18n-placeholder="auth.newpass.repeat.placeholder">
        <button class="password-toggle" data-action="togglePassword" data-target="confirm-password-input"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-eye"></use></svg></button>
      </div>
      <button class="btn" data-action="step5Next" data-i18n="auth.finish"></button>
      <button class="btn btn-secondary" data-action="goToStep" data-step="4" data-i18n="auth.back"></button>
    </div>

    <!-- Публичный адрес: открыть мессенджер с любого устройства и сети -->
    <div class="public-access" id="public-access" style="display:none">
      <div class="public-access-title" data-i18n="public.title"></div>
      <div class="public-access-row">
        <span class="public-access-url" id="public-access-url"></span>
        <button class="public-access-copy" data-action="copyPublicUrl" data-i18n-title="public.copy" title="Копировать"><svg class="mq-icon mq-icon--sm" aria-hidden="true" focusable="false"><use href="#mq-i-copy"></use></svg></button>
      </div>
      <div class="public-access-note" data-i18n="public.note"></div>
    </div>
  </div>
</div>

<!-- ==================== ОСНОВНОЕ ПРИЛОЖЕНИЕ ==================== -->
<div id="app">
  <div class="app-container" id="app-container">
    
    <div class="menu-backdrop" id="menu-backdrop" data-action="toggleMenu"></div>

          <span class="icon"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-user"></use></svg></span> <span data-i18n="menu.profile"></span>

          <span class="icon"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-lock"></use></svg></span> <span data-i18n="menu.encryption"></span>
        </button>
        <div class="side-menu-divider"></div>
        <button class="side-menu-item" data-action="logout" style="color: var(--danger)">
          <span class="icon"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-logout"></use></svg></span> <span data-i18n="menu.logout"></span>
        </button>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">
        <button class="menu-btn" data-action="toggleMenu"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-menu"></use></svg></button>
        <div class="search-box">
          <svg class="mq-icon mq-icon--sm" aria-hidden="true" focusable="false"><use href="#mq-i-search"></use></svg>
          <input type="text" placeholder="Поиск" id="sidebar-search" data-action="searchChats" data-i18n-placeholder="search.placeholder">
        </div>
      </div>
      <div class="folder-bar" id="folder-bar"></div>
      <div class="chat-list" id="chat-list"></div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="empty-state" id="empty-state">
        <div class="empty-state-icon"><svg class="mq-icon mq-icon--xl" aria-hidden="true" focusable="false"><use href="#mq-i-message"></use></svg></div>
        <h2 data-i18n="app.empty.title"></h2>
        <p data-i18n="app.empty.text"></p>
        <div class="encryption-badge" style="margin-top: 14px">
          <span data-i18n="app.encrypted"></span>
        </div>
      </div>

      <div id="active-chat" style="display:none; flex-direction:column; height:100%">
        <div class="chat-header">
          <button class="menu-btn back-btn" data-action="closeChat"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-arrow-left"></use></svg></button>
          <!-- Аватар шапки заполняет setChatAvatar (app.js): буква имени чата
               или <img>. Хардкод «U» убран. -->
          <div class="chat-avatar" id="chat-header-avatar"></div>
          <div class="chat-header-info">
            <div class="chat-header-name-row">
              <span class="chat-header-name" id="chat-header-name" data-i18n="chat.generic">Чат</span>
              <span class="owner-badge-slot" id="chat-header-owner"></span>
              <span class="chat-header-ttl" id="chat-header-ttl" hidden></span>
              <span class="enc-badge secured" id="enc-badge" style="display:none"><svg class="mq-icon mq-icon--xs" aria-hidden="true" focusable="false"><use href="#mq-i-lock"></use></svg><span>E2EE</span></span>
            </div>
            <div class="chat-header-status" id="chat-header-status" data-i18n="chat.online">в сети</div>
          </div>
          <div class="chat-header-actions">
            <button class="menu-btn call-header-btn" id="call-audio-btn" data-action="startAudioCall" title="Аудиозвонок" data-i18n-title="call.audio"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-phone"></use></svg></button>
            <button class="menu-btn call-header-btn" id="call-video-btn" data-action="startVideoCall" title="Видеозвонок" data-i18n-title="call.video"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-video"></use></svg></button>
            <button class="menu-btn" data-action="openPinnedModal" title="Закреплённые" data-i18n-title="chat.pinned"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-pin"></use></svg></button>
            <button class="menu-btn" data-action="showChatInfo" title="Инфо" data-i18n-title="chat.info"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-info"></use></svg></button>
          </div>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <button id="scroll-down-fab" class="mq-fab" data-action="scrollToBottom" title="Вниз" data-i18n-title="chat.scrollDown" aria-label="Scroll down">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"></path>
          </svg>
          <span class="mq-fab-badge" id="scroll-fab-badge" style="display:none">0</span>
        </button>

        <div class="reply-bar" id="reply-bar" style="display:none">
          <div class="rb-info">
            <div class="rb-title" id="reply-bar-title" data-i18n="reply.title">Ответ</div>
            <div class="rb-text" id="reply-bar-text"></div>
          </div>
          <button class="rb-close" data-action="cancelReply" title="Отменить" data-i18n-title="reply.cancel"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-x"></use></svg></button>
        </div>

        <div class="input-area" id="input-area">
          <button class="attach-btn" id="attach-btn" data-action="attachFile" title="Прикрепить" data-i18n-title="chat.attach"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-paperclip"></use></svg></button>
          <button class="attach-btn sticker-btn" id="sticker-btn" data-action="openStickerPicker" title="Стикеры" data-i18n-title="chat.stickers"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-sticker"></use></svg></button>
          <textarea class="message-input" id="message-input" placeholder="Сообщение..." rows="1" data-i18n-placeholder="chat.placeholder"
            data-action="messageInput"></textarea>
          <button class="attach-btn" id="voice-btn" data-action="toggleVoiceRecording" title="Голосовое" data-i18n-title="chat.voice"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-mic"></use></svg></button>
          <button class="attach-btn" id="video-btn" data-action="toggleVideoRecording" title="Видеосообщение" data-i18n-title="chat.video"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-video"></use></svg></button>
          <button class="send-btn" id="send-btn" data-action="sendMessage"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-send"></use></svg></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Нижняя навигация — версия для телефона -->
  <nav class="mobile-nav" id="mobile-nav" aria-label="Навигация">
    <button class="tab-item active" data-action="mobileChats" data-i18n-title="nav.chats">
      <span class="tab-icon"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-message"></use></svg></span><span class="label" data-i18n="nav.chats"></span>
    </button>
    <button class="tab-item" data-action="openSearch" data-i18n-title="nav.search">
      <span class="tab-icon"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-search"></use></svg></span><span class="label" data-i18n="nav.search"></span>
    </button>
    <button class="tab-item" data-action="openNewGroup" data-i18n-title="nav.group">
      <span class="tab-icon"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-users"></use></svg></span><span class="label" data-i18n="nav.group"></span>
    </button>
    <button class="tab-item" data-action="openProfileEditor" data-i18n-title="nav.profile">
      <span class="tab-icon"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-user"></use></svg></span><span class="label" data-i18n="nav.profile"></span>
    </button>
  </nav>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<div id="toast-container"></div>

<div id="pin-lock-screen">
  <div class="pin-lock-box">
    <div class="pin-logo"><svg class="mq-icon " aria-hidden="true" focusable="false"><use href="#mq-i-lock"></use></svg></div>
    <h2 data-i18n="pin.title"></h2>
    <p data-i18n="pin.desc"></p>
    <input type="password" id="pin-lock-input" class="pin-input" maxlength="8" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    <div class="pin-error" id="pin-lock-error"></div>
    <button class="btn" data-action="unlockWithPin" data-i18n="pin.unlock"></button>
    <button class="btn btn-secondary" data-action="logout" data-i18n="menu.logout"></button>
  </div>
</div>

<canvas id="snow-canvas" aria-hidden="true"></canvas>

<script src="/i18n.js"></script>
<script src="/icons.js"></script>
<script src="/motion.js"></script>
<script src="/cursor.js"></script>
<script src="/e2ee.js"></script>
<script src="/app.js"></script>
<script src="/chat-features.js"></script>
<script src="/calls.js"></script>
</body>
</html>
