<!DOCTYPE html>
<!--
  ============================================================================
   index.html — ЕДИНСТВЕННАЯ HTML-страница приложения (как Telegram Web)
  ============================================================================
   Структура:
     #auth-screen  — экран входа/регистрации (показывается, если нет сессии)
     #app          — основной интерфейс: слева список чатов, справа переписка
     #modal        — универсальное всплывающее окно (новый чат/группа/профиль)
   Логика живёт в js/: api.js (сеть), e2ee.js (шифрование), app.js (UI).
  ============================================================================
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teleport — мессенджер</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== ЭКРАН АВТОРИЗАЦИИ ==================== -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">✈️</div>
      <h1>Teleport</h1>
      <p class="auth-sub">Мессенджер со сквозным шифрованием</p>

      <!-- переключатель Вход / Регистрация -->
      <div class="auth-tabs">
        <button id="tab-login" class="tab active">Вход</button>
        <button id="tab-register" class="tab">Регистрация</button>
      </div>

      <form id="auth-form" autocomplete="off">
        <input id="a-username" placeholder="Логин (например vasya)" required>
        <input id="a-name" placeholder="Имя (как увидят другие)" class="hidden">
        <input id="a-password" type="password" placeholder="Пароль" required>
        <button type="submit" class="btn-primary" id="a-submit">Войти</button>
        <div id="a-error" class="auth-error"></div>
      </form>
      <p class="auth-hint">Приватный ключ генерируется в браузере и никогда<br>не покидает ваше устройство 🔒</p>
    </div>
  </div>

  <!-- ==================== ОСНОВНОЕ ПРИЛОЖЕНИЕ ==================== -->
  <div id="app" class="app hidden">

    <!-- ---------- левая колонка: шапка + поиск + список чатов ---------- -->
    <aside class="sidebar">
      <header class="side-head">
        <button id="btn-menu" class="icon-btn" title="Меню">☰</button>
        <div class="search-wrap">
          <input id="chat-search" placeholder="Поиск" autocomplete="off">
          <div id="search-results" class="search-results hidden"></div>
        </div>
      </header>
      <div id="chat-list" class="chat-list"><!-- чаты рисует app.js --></div>
    </aside>

    <!-- ---------- правая колонка: переписка ---------- -->
    <main class="chat-pane">
      <!-- вид «выберите чат», когда ничего не открыто -->
      <div id="empty-state" class="empty-state"><span>Выберите чат, чтобы начать общение</span></div>

      <section id="chat-view" class="chat-view hidden">
        <!-- шапка чата: название, статус, кнопки -->
        <header class="chat-head">
          <div id="ch-avatar" class="avatar"></div>
          <div class="chat-head-info">
            <div id="ch-title" class="chat-title"></div>
            <div id="ch-status" class="chat-status"></div>
          </div>
          <button id="btn-pin-panel" class="icon-btn hidden" title="Закреплённые">📌</button>
          <button id="btn-chat-info" class="icon-btn" title="Информация">⋮</button>
        </header>

        <!-- плашка закреплённого сообщения -->
        <div id="pinned-bar" class="pinned-bar hidden">📌 <span id="pinned-text"></span></div>

        <!-- лента сообщений -->
        <div id="messages" class="messages"></div>

        <!-- индикатор «печатает…» -->
        <div id="typing" class="typing hidden"></div>

        <!-- панель ответа на сообщение -->
        <div id="reply-bar" class="reply-bar hidden">
          <span>↩ Ответ: <b id="reply-preview"></b></span>
          <button id="reply-cancel">✕</button>
        </div>

        <!-- поле ввода -->
        <footer class="composer">
          <button id="btn-attach" class="icon-btn" title="Прикрепить файл">📎</button>
          <input type="file" id="file-input" class="hidden">
          <textarea id="msg-input" placeholder="Сообщение" rows="1"></textarea>
          <button id="btn-send" class="send-btn" title="Отправить">➤</button>
        </footer>
      </section>
    </main>

    <!-- ---------- выезжающая панель информации о чате ---------- -->
    <aside id="info-panel" class="info-panel hidden"></aside>
  </div>

  <!-- ==================== МОДАЛЬНОЕ ОКНО (универсальное) ==================== -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head"><h3 id="modal-title"></h3><button id="modal-close" class="icon-btn">✕</button></div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- контекстное меню сообщения (ответ/редакт/удалить/реакции/закрепить) -->
  <div id="ctx-menu" class="ctx-menu hidden"></div>

  <!-- скрипты: сначала утилиты, потом сеть, шифрование, и наконец UI -->
  <script src="js/e2ee.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
